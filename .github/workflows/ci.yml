name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Create release package
        run: |
          mkdir -p dist/package
          python - <<'PY'
          from pathlib import Path
          import shutil

          package = Path("dist/package")
          shutil.copytree(
              "app", package / "app", dirs_exist_ok=True,
              ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.pyo"),
          )
          for filename in ("requirements.txt", "README.md", "VERSION"):
              shutil.copy2(filename, package / filename)
          shutil.make_archive("dist/sdi4213-app", "zip", root_dir=package)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdi4213-app
          path: dist/sdi4213-app.zip
          if-no-files-found: error
          retention-days: 90
